name: COMBO-1 + DISP-1 Research

on:
  push:
    branches: [ main ]
    paths:
      - 'research/crypto/**'
      - '.github/workflows/combo1-backtest.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn requests
      - name: Run COMBO-1 walk-forward backtest
        env:
          COMBO_OUT: combo1_results
          COMBO_CACHE: .combo1_cache
        run: python research/crypto/combo1_backtest_v2.py
      - name: Run DISP-1 event study
        env:
          COMBO_DAILY: combo1_results/daily_results.csv
          DISP_OUT: disp1_results
          DISP_CACHE: .disp1_cache
        run: python research/crypto/disp1_event_study.py
      - name: Upload COMBO-1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo1-results-${{ github.run_id }}
          path: combo1_results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload DISP-1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disp1-results-${{ github.run_id }}
          path: disp1_results/
          if-no-files-found: warn
          retention-days: 14
